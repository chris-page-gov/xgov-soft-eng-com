name: Publish assured OKF to Pages
on:
  workflow_run:
    workflows: ['Refresh daily OKF pack']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-catalogue-pages
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      SNAPSHOT_RUN_ID: ${{ github.event.workflow_run.id }}
      SNAPSHOT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.11'
      - name: Download the exact assured snapshot
        run: |
          if [ -n "$SNAPSHOT_RUN_ID" ]; then
            snapshot_tag="snapshot-$SNAPSHOT_RUN_ID-$SNAPSHOT_RUN_ATTEMPT"
          else
            snapshot_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if ! [[ "$snapshot_tag" =~ ^snapshot-[0-9]+-[0-9]+$ ]]; then
            echo 'The selected release is not an assured dataset snapshot.' >&2
            exit 1
          fi
          snapshot_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$snapshot_tag" --jq .sha)
          if [ "$snapshot_commit" != "$(git rev-parse HEAD)" ]; then
            echo 'The snapshot and checked-out producer commits differ.' >&2
            exit 1
          fi
          if [ "$(gh release view "$snapshot_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]; then
            echo 'A draft snapshot cannot be published to Pages.' >&2
            exit 1
          fi
          gh release download "$snapshot_tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/xgov-snapshot"
      - name: Verify and stage the existing candidate without rebuilding
        run: python scripts/pages.py --release "$RUNNER_TEMP/xgov-snapshot" "$RUNNER_TEMP/xgov-pages"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/xgov-pages
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deploy
