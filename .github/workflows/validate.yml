name: Validate OKF producer
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.11'
      - run: python -m pip install --require-hashes -r requirements-assurance.txt
      - run: python scripts/check_release_hygiene.py
        env:
          OKF_PR_TITLE: ${{ github.event.pull_request.title }}
      - run: python scripts/check_repository_protection.py --local
      - run: python -m unittest discover -s tests -v
      - run: python scripts/catalogue.py build
      - run: python scripts/catalogue.py check
      - run: python scripts/assure.py
